<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Simple Node.js Server</title>

        <link rel="icon" type="image/x-icon" href="/images/favicon.ico">
        <link rel="stylesheet" href="/css/style.css">

        <script src="/js/imageGallery.js" defer></script>
        <script src="/js/textBoard.js" defer></script>
        <script src="/js/app.js" defer></script>
    </head>

    <body>
        <h1>Simple Node.js Server</h1>
        <p>Interact with the server using its API endpoints</p>

        <section>
            <h2>Image Gallery</h2>
            <form id="imageForm">
                <input type="file" id="imageFile" accept="image/png" required>
                <button type="submit">Upload image</button>
            </form>

            <div id="imageGallery" class="image-gallery"></div>
        </section>

        <section>
            <h2>Text Board</h2>
            <form id="textForm">
                <textarea id="textInput" placeholder="Write something..." maxlength="2000" required></textarea>
                <button type="submit">Post text</button>
            </form>

            <div id="searchArea">
                <input type="search" id="textSearch" placeholder="Search texts...">
            </div>

            <div id="textBoard" class="text-board"></div>
        </section>

    </body>
    <script>
        
    </script>
</html>
